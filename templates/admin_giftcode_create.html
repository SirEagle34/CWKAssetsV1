{% extends "admin_base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
    <div>
        <h1 class="h2">Create Gift Code</h1>
        <div class="text-body-secondary">Example: HALLOWEEN26</div>
    </div>
    <a class="btn btn-outline-secondary" href="/admin/gift-codes">Back</a>
</div>

<style>
.neon-panel {
    border: 1px solid rgba(13,110,253,.35);
    box-shadow: 0 0 24px rgba(13,110,253,.12);
}
.reward-row {
    border: 1px solid var(--bs-border-color);
    border-radius: .75rem;
    padding: 1rem;
}
</style>

<form method="post">
<div class="card neon-panel mb-4">
    <div class="card-body">
        <h5 class="card-title">Code</h5>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Redeem Code</label>
                <input class="form-control text-uppercase" name="code" placeholder="HALLOWEEN26" required maxlength="64">
            </div>
            <div class="col-md-6">
                <label class="form-label">Subject</label>
                <input class="form-control" name="subject" placeholder="Halloween Gift">
            </div>
            <div class="col-12">
                <label class="form-label">Message</label>
                <textarea class="form-control" name="message" rows="2" placeholder="Happy Halloween!"></textarea>
            </div>
        </div>
    </div>
</div>

<div class="card neon-panel mb-4">
    <div class="card-body">
        <h5 class="card-title">Limits & Dates</h5>
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Max Uses</label>
                <input class="form-control" type="number" name="max_uses" value="0" min="0">
                <div class="form-text">0 = unlimited.</div>
            </div>
            <div class="col-md-4">
                <label class="form-label">Start Date</label>
                <input class="form-control" type="datetime-local" name="start_date">
            </div>
            <div class="col-md-4">
                <label class="form-label">End Date</label>
                <input class="form-control" type="datetime-local" name="end_date">
            </div>
        </div>
    </div>
</div>

<div class="card neon-panel mb-4">
    <div class="card-body">
        <h5 class="card-title">Currencies</h5>
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Soft Currency / Coins</label>
                <input class="form-control" type="number" name="soft_currency" value="0" min="0">
            </div>
            <div class="col-md-4">
                <label class="form-label">Free Hard Currency / Gems</label>
                <input class="form-control" type="number" name="free_hard_currency" value="0" min="0">
            </div>
            <div class="col-md-4">
                <label class="form-label">Paid Hard Currency</label>
                <input class="form-control" type="number" name="paid_hard_currency" value="0" min="0">
            </div>
        </div>
    </div>
</div>

<div class="card neon-panel mb-4">
    <div class="card-body">
        <h5 class="card-title">Creatures</h5>
        <p class="text-body-secondary small">JSON array. Example: one creature with 2 copies at Star 3.</p>
        <textarea class="form-control font-monospace" name="creatures_json" rows="5" placeholder='[{"id":"Creature_ID","amount":2,"star_rating":3}]'></textarea>
    </div>
</div>

<div class="card neon-panel mb-4">
    <div class="card-body">
        <h5 class="card-title">Action Cards / ExCards</h5>
        <p class="text-body-secondary small">JSON array. Example: 3 copies.</p>
        <textarea class="form-control font-monospace" name="action_cards_json" rows="5" placeholder='[{"id":"ActionCard_ID","amount":3}]'></textarea>
    </div>
</div>

<button class="btn btn-primary btn-lg" type="submit">
    <i class="bi bi-gift"></i> Create Gift Code
</button>
</form>
{% endblock %}
